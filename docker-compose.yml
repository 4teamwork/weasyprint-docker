version: "3.8"

services:
  pdf-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: bcc/pdf-service:latest
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined

    ports:
      - 8080:8080
    environment:
      AUTH_AUTHORITY: https://login.bcc.no/
      AUTH_AUDIENCES: api.bcc.no,pdf-server.bcc.no,pdf-server